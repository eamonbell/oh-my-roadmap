    task_id: enforcement-eval
    wave_id: wave-1
    severity: blocking
    status: deferred
    title: "wave-1 review: FAIL — evaluateBudgetEnforcement crashes on missing
      .omr/config.yml (7 test failures)"
    description: >-
      ## Verdict: FAILED (1 blocking, worker-fixable)


      ### Verification commands run

      - `bun run check` (tsc --noEmit): **PASS** (exit 0). Exports resolve,
      types clean.

      - `bun test test/enforcement.test.ts`: **FAIL** — 14 pass, 7 fail.

      - `bun test` (full): 378 pass, 10 fail. 7 are this wave's; 3 are
      pre-existing/unrelated (`styleGuideForFiles`, `scoped init > global
      init…`, `plugin install > resolvePluginRoot…` —
      profile/plugin-root/style-merge tests in files enforcement.ts does not
      touch).


      ### What passes (correct)

      The pure-function layer is solid and matches acceptance criteria:

      - `evaluateThresholds`: warn/soft/hard, no-ceiling→none, over_budget→hard,
      default policy (warn 75 / soft disabled / hard 100), soft-disabled skip,
      raised-ceiling lowers level, most-severe across dimensions, ceiling-zero
      edges. All 9 tests pass.

      - `formatBudgetBlockReason`: hard/soft messages + infinite-percentage →
      "over budget". All 3 tests pass.

      - Exports present: `evaluateThresholds`, `evaluateBudgetEnforcement`,
      `formatBudgetBlockReason`, `EnforcementLevel`, `EnforcementState`,
      `BudgetWarning` (plus `BudgetScope`, `ThresholdEvaluation`,
      `ScopeEnforcement`). Package export `@oh-my-roadmap/core/enforcement`
      resolves via `"./*": "./src/*.ts"`.

      - No mutation / no I/O writes in the evaluator; `softBreached`
      (level>=soft) and `hardBreached` (level==hard) semantics are sensible;
      overall level = most-severe across scopes; warnings flatMapped from both
      scopes.


      ### BLOCKING (worker-fixable): evaluateBudgetEnforcement throws ENOENT on
      missing config.yml


      `packages/core/src/enforcement.ts:164` calls `await loadConfig(cwd)`
      unconditionally once `state.active` exists. `loadConfig`
      (project-init.ts:336-338) does `readYamlFile(configPath(cwd))`, which
      throws `ENOENT` when `.omr/config.yml` is absent.


      `initRoadmap` (store/roadmap.ts:119-203) creates an active roadmap
      **without** creating `config.yml` — only
      `initProject`/`ensureConfig`/`initScoped` do. The worker's residual-risk
      note claims "config always exists after initRoadmap"; this is false. Every
      `evaluateBudgetEnforcement` test sets up an active roadmap via
      `initRoadmap`/`approvedMilestone` (no config.yml) and therefore crashes
      before reaching the ceiling/no-op logic.


      Failing tests (all same root cause):

      1. `returns a no-op state when no ceilings are configured`

      2. `evaluates only the roadmap scope when no milestone is active`

      3. `reports per-scope consumption and the most-severe breach across
      scopes`

      4. `reports one-shot availability per scope`

      5. `applies custom thresholds from project config` (also fails in
      `setThresholds` helper reading the absent config)

      6. `collects warnings for all breached dimensions`

      7. `skips a scope whose budget state has no ceilings`


      This violates exit criterion "test/enforcement.test.ts passes" and
      acceptance criteria "evaluateBudgetEnforcement is a no-op when no ceilings
      are configured" + "With no budgets configured, behavior is byte-for-byte
      the current behavior": a missing config.yml IS the canonical no-budgets
      state and must yield default thresholds, not throw.


      ### Required fix (owned file: packages/core/src/enforcement.ts)

      Guard the config load so an absent `.omr/config.yml` falls back to the
      default (empty) policy `{}` instead of throwing. The codebase already has
      this exact pattern:

      - `loadTransportResumeAttempts` (project-init.ts:340-345): `if (!(await
      fileExists(configPath(cwd)))) return DEFAULT…`

      - `loadMergedConfig`/effective-config (project-init.ts:447-451): `const
      project = (await fileExists(configPath(cwd))) ? await loadConfig(cwd) :
      undefined; … return project ?? defaultConfig()`


      Suggested: `const policy: BudgetThresholdPolicy = (await
      fileExists(configPath(cwd))) ? (await loadConfig(cwd)).budgets?.thresholds
      ?? {} : {}` (import `fileExists` from `./files` and `configPath` from
      `./project-init`, or reuse an existing effective-config helper). After
      this fix the no-op-when-no-ceilings and default-threshold paths become
      reachable and all 7 tests should pass; `loadConfig` would only run (and
      only matter) when budgets are actually configured.


      ### NON_BLOCKING notes

      - The 3 non-enforcement full-suite failures are pre-existing and outside
      this wave's scope (enforcement.ts is a new isolated module that imports
      but does not modify style/plugin/init code paths). Flagging only for
      awareness.

      - Residual risk (already noted by worker, valid): the `time` dimension is
      time-dependent when the clock is running (`started_at` set); tests
      correctly use paused clocks. Downstream consumers should keep this in mind
      — not a wave-1 concern.

      - `loadConfig` is also called even when no scope ends up having ceilings.
      After the fix, consider lazy-loading config only when at least one scope
      has ceilings to avoid unnecessary I/O on the no-op path — optional, not
      blocking.


      ### Scope confirmation

      This wave delivers only the evaluation source + tests.
      Gate/dispatch/override/report integration (gate-eval,
      dispatch-enforcement, override-exposure) are later waves and were
      correctly NOT attempted here — no scope creep. The single blocking issue
      is the config-load crash, which is worker-fixable with no user decision
      needed.
